name: Android build
on:
  pull_request:
    paths: ['android/**', '.github/workflows/android-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'false'
      - name: Install required Android platform
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build and lint
        working-directory: android
        run: bash ./gradlew --no-daemon lintDebug assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: nur-android-build
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/reports/lint-results-debug.html
          if-no-files-found: error
